  <script>
    const ids = ['w23','w1','w2','w3','w4','w5','w6','w7','w8','w9','w10','w11','w12','w13','w14','w15','w16','w17','w18','w19','w20','w21','w22'];
    document.getElementById('grid').innerHTML = ids.map(id => productCardHTML(CARTER_CATALOG[id])).join('');
    bindAddButtons();
    document.querySelectorAll('#grid .reveal').forEach(el => {
      new IntersectionObserver((entries, io) => {
        entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('is-visible'); io.unobserve(e.target); } });
      }, { threshold: 0.08 }).observe(el);
    });
