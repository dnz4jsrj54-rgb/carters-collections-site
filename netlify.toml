# Netlify config for Carter's Collection
# Static site + serverless functions for Stripe Checkout

[build]
  command = "node scripts/generate-google-merchant-feed.mjs"
  publish = "."
  functions = "netlify/functions"

[functions]
  # Use the modern Node runtime
  node_bundler = "esbuild"

# Optional: nicer URL — POST /api/create-checkout instead of /.netlify/functions/create-checkout
[[redirects]]
  from = "/api/create-checkout"
  to = "/.netlify/functions/create-checkout"
  status = 200
  force = true

# Spin-the-wheel: generate a unique single-use promo code per spin
[[redirects]]
  from = "/api/spin-reward"
  to = "/.netlify/functions/spin-reward"
  status = 200
  force = true

# Stripe webhook endpoint
[[redirects]]
  from = "/api/stripe-webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200
  force = true

# Retrieve Stripe session details for thank-you page (Pinterest Purchase event)
[[redirects]]
  from = "/api/get-session"
  to = "/.netlify/functions/get-session"
  status = 200
  force = true

# Canonical public URLs: homepage uses /; all other HTML pages retain .html.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

