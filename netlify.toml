# Canonical host: redirect netlify.app to apex domain
[[redirects]]
  from = "https://mellow-frangollo-645303.netlify.app/*"
  to = "https://carterscollections.com/:splat"
  status = 301
  force = true

# Force HTTPS + apex (www -> apex, your call — adjust if you set www as primary)
# Netlify handles HTTPS automatically once SSL is provisioned.

# SEO file headers
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/google-merchant-feed.xml"
  [headers.values]
    Content-Type = "application/rss+xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=86400"

# Long-cache static assets (safe because HTML uses ?v=timestamp cache-busters)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML pages: never cache, always revalidate so users see latest deploy
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/pages/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
